[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tuskpool"
version = "0.1.0"
description = "An asyncio task pool with capped concurrency and bounded memory."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sudodex" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["asyncio", "concurrency", "task pool", "backpressure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/pseudodex/tuskpool"
Issues = "https://github.com/pseudodex/tuskpool/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "mypy>=1.10",
]
bench = [
    "aiometer>=1.0",
    "aiostream>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tuskpool"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 30
filterwarnings = ["error"]

[tool.mypy]
strict = true
files = ["src"]
